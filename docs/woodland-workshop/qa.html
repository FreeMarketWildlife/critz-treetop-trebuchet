<!doctype html><meta charset="utf-8"><title>Woodland workshop acceptance</title><style>body{margin:0;background:#e9e8d2;color:#294a3a;font:15px system-ui}header{padding:16px 24px;background:#294a3a;color:#f7e5b4}button{padding:10px;border:0;border-radius:8px;background:#e9c87e;color:#294a3a;margin:6px}#art{display:flex;justify-content:space-around;padding:12px}.card{text-align:center}canvas{display:block}iframe{width:100%;height:720px;border:0}pre{padding:15px;white-space:pre-wrap}</style><header><b>Grimroot · six little troublemakers</b> <button id="run">Run editor gesture acceptance</button> <button id="lineup">Download lineup PNG</button> <span id="result">Ready</span></header><section id="art"></section><pre id="log"></pre><iframe src="../../editor.html?qa=1"></iframe><script type="module">
import {WOODLAND_ENEMIES} from '../../src/woodland-encounters.js?v=62';

const frame=document.querySelector('iframe'),pause=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))),key='treetop-editor-qa:treetop-grove-map-v2';
run.onclick=async()=>{let lines=[];const check=(v,m)=>{if(!v)throw Error(m);lines.push('PASS · '+m);log.textContent=lines.join('\n');};try{
 const win=frame.contentWindow,root=win.document.querySelector('#worldEditor').shadowRoot,$=id=>root.getElementById(id),canvas=$('map'),box=canvas.getBoundingClientRect();
 const saved=()=>JSON.parse(win.sessionStorage.getItem(key));const count=()=>Number(canvas.dataset.objects),before=count();
 canvas.setPointerCapture=()=>{}; // Synthetic pointer IDs have no OS capture. Production handler remains otherwise intact.
 const send=(type,x,y,id=51,pointerType='mouse')=>canvas.dispatchEvent(new win.PointerEvent(type,{bubbles:true,clientX:box.left+x,clientY:box.top+y,pointerId:id,pointerType,button:0}));
 const stroke=(points,id=51,kind='mouse')=>{send('pointerdown',...points[0],id,kind);for(const p of points.slice(1))send('pointermove',...p,id,kind);send('pointerup',...points.at(-1),id,kind);};
 root.querySelector('[data-tool="freehand"]').click();stroke([[220,140],[320,140],[320,180],[260,180],[260,240],[220,240],[220,140]]);await pause();check(count()===before+1,'freehand release adds one filled polygon');let shape=saved().objects.at(-1);check(shape.type==='polygon'&&shape.points.length>=6,'concave outline remains closed and filled');
 $('undo').click();await pause();check(count()===before,'drawing undo restores map');$('redo').click();await pause();check(count()===before+1,'drawing redo restores polygon');
 root.querySelector('[data-tool="freehand"]').click();stroke([[400,140],[500,240],[400,240],[500,140]]);await pause();check(count()===before+1&&/cross|wider|interior/.test($('status').textContent),'crossed freehand rejected without changing saved geometry');
 root.querySelector('[data-tool="path"]').click();stroke([[400,140],[450,180],[500,140]]);await pause();check(saved().objects.at(-1).type==='chain','explicit Open path remains open');
 root.querySelector('[data-tool="freehand"]').click();send('pointerdown',350,260);send('pointermove',400,280);send('pointercancel',400,280);await pause();check(count()===before+2,'cancelled gesture leaves no partial terrain');
 stroke([[350,260],[410,260],[410,320],[350,320]],52,'touch');await pause();check(count()===before+3,'touch freehand closes and fills');
 send('pointerdown',350,260,53,'touch');send('pointermove',400,300,53,'touch');send('pointerdown',450,260,54,'touch');send('pointermove',470,270,54,'touch');send('pointerup',400,300,53,'touch');send('pointerup',470,270,54,'touch');await pause();check(count()===before+3,'two-finger pinch cancels unfinished stroke');
 root.querySelector('[aria-label="Place Lantern moth"]').click();stroke([[300,180],[300,180]]);await pause();check(saved().objects.at(-1).kind==='lantern-moth','moth palette places authored encounter');
 $('encounter-speed').value='1.2';$('encounter-dx').value='3';$('encounter-dy').value='1.5';$('properties').requestSubmit();await pause();check(saved().objects.at(-1).encounter.speed===1.2,'inspector persists speed and route');
 root.querySelector('[data-tool="select"]').click();const scale=parseFloat($('zoom').textContent)/100*24,placed=saved().objects.at(-1),cx=$('jumpX').valueAsNumber,cy=$('jumpY').valueAsNumber-32,bx=box.width/2+(placed.x+3-cx)*scale,by=box.height/2-(placed.y+1.5-cy)*scale;
 send('pointerdown',bx,by);send('pointermove',bx+25,by-15);send('pointerup',bx+25,by-15);await pause();check(saved().objects.at(-1).encounter.dx!==3,'dragging B changes the saved route');$('undo').click();await pause();check(saved().objects.at(-1).encounter.dx===3,'route edit undo restores endpoint');$('redo').click();await pause();
 const m=saved();check(JSON.stringify(validateGroveMap(JSON.parse(JSON.stringify(m))))===JSON.stringify(m),'new map JSON export/import round trip');check(JSON.stringify(await decodeMapLink(await encodeMapLink(m)))===JSON.stringify(m),'portable link round trip retains settings');
 root.querySelector('[data-tool="select"]').click();await pause();check($('portrait').width===260,'animated inspector preview available');
 result.textContent=`${lines.length} checks passed`;log.textContent=lines.join('\n');
