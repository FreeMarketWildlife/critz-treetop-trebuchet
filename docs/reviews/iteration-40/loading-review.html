<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recorded physical loading review</title><style>body{background:#182722;color:#ecf0df;font:14px system-ui}button,select{min-height:44px}canvas{width:100%;max-width:960px;height:auto;display:block}</style><p>Save-free actual recorded grip replay. Experimental option, disabled in ordinary play: two bounded loading steps only near real contacts or angular stops. No pose changes. This page neither reads nor writes earned saves.</p><select aria-label="Review case" id="case"><option>stock-chipmunk-0.6</option><option>combined-chipmunk-0.75</option></select><button id="restart">Restart</button><button id="pause">Resume</button><button id="advance">Advance 1s</button><label><input id="reduced" type="checkbox" checked>Reduced decorative motion</label><p id="status"></p><canvas id="view" width="960" height="600"></canvas><script type="module">
import{PhysicalHookScene}from'../../../src/hook-experiment.js?v=40';import{createRenderer}from'../../../src/render.js?v=38-final';const $=id=>document.getElementById(id),renderer=createRenderer($('view'));let s,input,n=0,paused=true,last=0,max=0;async function reset(){const id=$('case').value;input=await(await fetch(`input-${id}.json`)).json();const snapshot=await(await fetch(`postwind-${id}.json`)).json();s=new PhysicalHookScene(snapshot.p,snapshot.species,snapshot);s.p.loadingConstraintSubsteps=true;n=0;max=0;paused=true;$('pause').textContent='Resume';const integrate=s.integrate.bind(s);s.integrate=dt=>{integrate(dt);for(let j=s.world.getJointList();j;j=j.getNext())if(j.getType()==='revolute-joint'&&j.isLimitEnabled())max=Math.max(max,j.getJointAngle()-j.getUpperLimit(),j.getLowerLimit()-j.getJointAngle());};}function step(){if(n===600)s.grab(input.tape.grab);if(n>=600&&n<2400)s.move(input.tape.targets[n-600]);if(n===2400)s.drop();if(n<2700+input.tape.waitSteps){s.step();n++;}}$('case').onchange=reset;$('restart').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};$('advance').onclick=()=>{paused=true;$('pause').textContent='Resume';for(let i=0;i<600;i++)step();};await reset();function frame(now){if(!paused)for(let i=0;i<Math.min(30,Math.round((now-last)*.6));i++)step();last=now;renderer.draw(s,null,[],n/600,$('reduced').checked,innerWidth,innerHeight,'');const q=s.loadingStatus();$('status').textContent=`${$('case').value} • loading ${(n/600).toFixed(2)}s • held ${Boolean(s.hand)} • actual pouch contact ${q.contacting} • ready ${s.isLoaded()} • maximum inner angular overrun ${max.toFixed(5)} rad • assist work ${s.assistWork}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
