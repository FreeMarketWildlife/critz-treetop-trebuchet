<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlled physical bounce review</title><style>body{font:14px system-ui;background:#182722;color:#edf0df;margin:10px;max-width:700px}button,select,label{min-height:44px;padding:6px}canvas{width:100%;display:block}</style>
<h1>Controlled physical bounce review</h1><p>QA fixture, not a game run. Uses a recorded incoming lizard, translated as an initial condition for the real canopy branch. No save or rewards. Stops 0.10 simulated seconds after the first actual impact so the bounded feedback can be inspected.</p>
<select id="material" aria-label="Contact surface"><option value="canopy">Canopy branch</option><option value="ground">Ground</option></select><button id="start">Replay actual contact</button><label><input type="checkbox" id="reduced">Reduced motion</label><p id="status" role="status"></p><canvas id="view"></canvas>
<script type="module">
import{PhysicalHookScene}from'../../../src/hook-experiment.js';import{createRenderer}from'../../../src/render.js';
const raw=await(await fetch('../iteration-18/incoming-default-lizard-head.json')).json(),canvas=document.querySelector('canvas'),renderer=createRenderer(canvas);let s,effects=[],first=null,stopped=false,elapsed=0;
function restart(){s=new PhysicalHookScene(raw.p,raw.species,raw);if(document.querySelector('#material').value==='canopy'){const c=s.center();for(const part of s.parts){const p=part.getPosition();part.setPosition({x:p.x+200-c.x,y:p.y+105});}}s.events.length=0;effects=[];first=null;elapsed=0;stopped=false;}
document.querySelector('#start').onclick=restart;document.querySelector('#material').onchange=restart;restart();
function frame(){if(!stopped){for(let i=0;i<10;i++){s.step();elapsed+=1/600;for(const e of s.events.splice(0))if(e.type==='impact'){first??=elapsed;effects.push({x:e.position.x,y:e.position.y,life:.4,material:e.material,strength:Math.min(1,e.strength/Math.max(.1,s.rig.totalMass*10))});}effects=effects.map(e=>({...e,life:e.life-1/600})).filter(e=>e.life>0).slice(-20);if(first!==null&&elapsed-first>=.1||elapsed>1){stopped=true;break;}}}renderer.draw(s,null,effects,elapsed,document.querySelector('#reduced').checked,innerWidth,innerHeight);document.querySelector('#status').textContent=`${document.querySelector('#material').value} • ${elapsed.toFixed(3)} s • ${s.impactCount} physical impacts • ${effects.length} bounded rings • ${stopped?'paused':'running inspection'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
