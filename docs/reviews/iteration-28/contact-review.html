<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encounter contact fixtures — live game renderer</title>
<style>body{margin:0;padding:8px;background:#182722;color:#ecf0df;font:14px system-ui}button,select,label{min-height:44px}canvas{display:block;width:100%;max-width:960px;height:auto;background:#d4e0dc}p{max-width:760px}#status{min-height:3em}</style>
<p>Encounter contact fixtures: synthetic incoming mouse poses, live passive physics and the real game renderer. No game save, reward banking or audio. These are contact/readability tests, not normal throws.</p>
<select id="case" aria-label="Encounter fixture"><option value="canopy">Canopy waxleaf skid</option><option value="floor">Floor seed-husk skid</option><option value="bounce">Round fungus bounce</option><option value="edge">Waxleaf edge telegraph</option></select><button id="replay">Replay</button><button id="pause">Pause</button><label><input id="reduced" type="checkbox">Reduced decorative motion</label><p id="status"></p><canvas id="view" width="480" height="600" aria-label="Live encounter contact fixture"></canvas>
<script type="module">
import * as P from '../../../node_modules/planck/dist/planck.mjs';import {CritterScene} from '../../../src/articulated.js';import {createEncounterBody} from '../../../src/encounter-body.js';import {encounterPools} from '../../../src/encounters.js';import {createRenderer} from '../../../src/render.js';
const $=id=>document.getElementById(id),renderer=createRenderer($('view'));let scene,time=0,last=0,paused=false,events=0;
function reset(){const kind=$('case').value,pool=kind==='canopy'||kind==='edge'?'jungleCanopy':'forestFloor',recipe=encounterPools[pool].find(e=>e.shape===(kind==='bounce'?'cap':'skid')),y=pool==='jungleCanopy'?65:2;
 scene=new CritterScene({},'mouse');const c=scene.center();for(const b of scene.parts){const p=b.getPosition();b.setPosition(P.Vec2(p.x-c.x+500,p.y-c.y+y+(kind==='edge'?0:2)));b.setLinearVelocity(P.Vec2(kind==='edge'?8:3,kind==='edge'?0:-8));}scene.phase='flight';scene.release={time:0,center:scene.center()};const enemy=createEncounterBody(scene.world,{...recipe,id:'fixture',biome:pool,x:500+(kind==='edge'?6.8:0),y,vx:0,vy:0,expiresAt:99,material:recipe});scene.enemies.set('fixture',enemy);time=0;events=0;last=0;paused=false;$('pause').textContent='Pause';}
$('case').onchange=reset;$('replay').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};reset();
function frame(now){const dt=Math.min(.03,last?(now-last)/1000:0);last=now;if(!paused&&time<2){const n=Math.round(dt*600);for(let i=0;i<n;i++)scene.step(1/600);time+=n/600;events+=scene.events.splice(0).filter(e=>e.type==='impact').length;}renderer.draw(scene,null,[],time,$('reduced').checked,innerWidth,innerHeight);$('status').textContent=`${$('case').selectedOptions[0].textContent} • ${time.toFixed(2)} s • ${events} counted impacts • ${renderer.approachNotice||'No edge cue at this pose.'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
