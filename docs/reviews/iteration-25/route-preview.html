<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Natural incoming mouse — physical branch review</title><style>body{margin:12px;background:#182722;color:#ecf0df;font:14px system-ui}button{padding:10px;margin:3px}canvas{display:block;width:100%;max-width:960px;background:#ccdccd}p{max-width:65em}</style><h1>Natural incoming mouse</h1><p>QA playback of an actual wound, hand-loaded and physically released mouse. Original incoming state; 0.1× simulated time. No rewards or saved progress. Amber arrows advise about the real fixed geometry; the downhill line is the contact surface.</p><button id="pause">Play</button><button id="reset">Replay incoming state</button><label><input type="checkbox" id="reduced">Reduced motion</label><output id="state"></output><canvas id="view"></canvas><script type="module">
import {PhysicalHookScene} from '../../../src/hook-experiment.js';import {createRenderer} from '../../../src/render.js';const saved=(await(await fetch('./natural-mouse-incoming.json')).json()).snapshot,canvas=document.querySelector('canvas'),renderer=createRenderer(canvas),status=document.querySelector('#state');let scene,playing=false,last=0,elapsed=0,accumulator=0,contacts=[];function reset(){scene=new PhysicalHookScene(saved.p,saved.species,saved);playing=false;elapsed=0;accumulator=0;contacts=[];document.querySelector('#pause').textContent='Play';}reset();document.querySelector('#reset').onclick=reset;document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'Pause':'Play';};function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;if(playing){accumulator+=dt*.1;while(accumulator>=1/600){scene.step();elapsed+=1/600;accumulator-=1/600;for(const e of scene.events.splice(0))if(e.type==='impact')contacts.push(e.surface??e.material);}}renderer.draw(scene,null,[],elapsed,document.querySelector('#reduced').checked,innerWidth,innerHeight);status.textContent=` ${elapsed.toFixed(3)} s • ${scene.center().y.toFixed(1)} m high • ${contacts.join(', ')||'before contact'} • ${renderer.approachNotice}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
