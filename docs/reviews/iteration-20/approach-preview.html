<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controlled physical encounter review</title><style>body{font:14px system-ui;background:#182722;color:#ecf0df;margin:8px}button,select,label{font:inherit;min-height:44px;margin:4px}canvas{width:100%;max-width:960px;display:block}output{display:block;min-height:3em}</style><h1>Controlled physical encounter review</h1><p>Isolated fixture, no game wallet or save access. Actual articulated rig, physical enemy radius and fixed geography. Slow playback changes clock rate only, not world speed or forces.</p><select id="region"><option>grandfatherTree</option><option>openSky</option><option>jungleCanopy</option><option>forestFloor</option></select><label>Speed <select id="speed"><option>20</option><option selected>50</option><option>100</option></select> m/s</label><label><input id="slow" type="checkbox" checked>Quarter-speed review</label><label><input id="reduced" type="checkbox">Reduced motion</label><label><input id="contactPause" type="checkbox" checked>Pause at first contact</label><button id="start">Start / restart approach</button><button id="pause">Pause</button><output id="status">Choose a biome and start.</output><canvas id="view"></canvas><script type="module">
import * as P from '../../../node_modules/planck/dist/planck.mjs';import{PhysicalHookScene}from'../../../src/hook-experiment.js';import{createRenderer}from'../../../src/render.js';import{encounterPools}from'../../../src/encounters.js';
const $=id=>document.getElementById(id),renderer=createRenderer($('view'));let scene=null,time=0,acc=0,last=0,paused=false,effects=[],impacts=0;
function start(){scene=new PhysicalHookScene({initialArm:-3,mechanicalWinding:true,stoppedSplitPouch:true,releaseHardware:'channel',collisionSubsteps:true,collisionStepHz:2400,fastCollisionStepHz:4800},'lizard');const y={grandfatherTree:305,openSky:190,jungleCanopy:65,forestFloor:3}[$('region').value],c=scene.center(),speed=Number($('speed').value);for(const b of scene.parts){const p=b.getPosition();b.setPosition(P.Vec2(p.x+40-c.x,p.y+y-c.y));b.setLinearVelocity(P.Vec2(speed,10));}scene.phase='flight';scene.release={time:0,center:scene.center()};const recipe=encounterPools[$('region').value][0],body=scene.world.createDynamicBody({position:P.Vec2(40+speed*.9,y),linearVelocity:P.Vec2(0,10),bullet:true});body.setUserData({role:'enemy',id:'controlled',kind:recipe.kind,shape:recipe.shape,color:recipe.color,biome:$('region').value});body.createFixture(P.Circle(recipe.radius),{density:recipe.mass/(Math.PI*recipe.radius**2),friction:recipe.friction,restitution:recipe.restitution,filterCategoryBits:32,filterMaskBits:5});scene.enemies.set('controlled',body);time=acc=0;effects=[];impacts=0;paused=false;$('pause').textContent='Pause';}
$('start').onclick=start;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};
function frame(now){const dt=Math.min(.025,(now-last)/1000);last=now;if(scene){if(!paused){acc+=dt*($('slow').checked?.25:1);let n=0;while(acc>=1/600&&n++<100){scene.step();acc-=1/600;time+=1/600;for(const e of scene.events.splice(0))if(e.type==='impact'){impacts++;if($('contactPause').checked){paused=true;$('pause').textContent='Resume';}if(!$('reduced').checked)effects.push({...e.position,life:.4,material:e.material,strength:.5});}}effects=effects.map(e=>({...e,life:e.life-dt})).filter(e=>e.life>0).slice(-20);}renderer.draw(scene,null,effects,time,$('reduced').checked,innerWidth);const c=scene.center();$('status').textContent=`${$('region').value} • ${scene.enemies.get('controlled').getUserData().kind} • elapsed ${time.toFixed(2)} s • speed ${Math.hypot(c.vx,c.vy).toFixed(1)} m/s • impacts ${impacts} • ${paused?'paused':'running'} • ${renderer.approachNotice}`;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
