<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Physical sling slack and recovery review</title>
<style>#mechanism{max-width:480px;}[hidden]{display:none!important}body{margin:0;padding:8px;background:#182722;color:#ecf0df;font:14px system-ui}select,button,label{min-height:44px}canvas{display:block;width:100%;max-width:960px;height:auto;background:#d4e0dc}p{max-width:850px}#status{min-height:3em}</style>
<p>Save-free practical loading review. The close-up shows the actual cradle, straps and nearby support fixtures. Amber dots mark real pouch touching points; they do not certify containment or change release eligibility. All prepared states come from real winding and force-driven loading.</p><select id="case" aria-label="Review case"><option value="mechanism">Physical sling and fixed counterweight</option></select><select id="speed" aria-label="Replay speed"><option value="1">1×</option><option value=".25">0.25×</option></select><button id="replay">Restart</button><button id="pause">Pause</button><label><input id="inspect" type="checkbox">Fixed mechanism inspection camera</label><button id="advance">Advance 1s</button><button id="step">Step 0.02s</button><button id="wind">Wind real motor to medium</button><label><input id="reduced" type="checkbox">Reduced decorative motion</label><p id="status"></p><canvas id="view" width="480" height="600" aria-label="Natural physics replay and real mechanism"></canvas>
<canvas id="mechanism" width="480" height="600" hidden aria-label="Actual mechanism in fixed inspection camera"></canvas>
<script type="module">
import{drawMechanismDetails}from'../../../src/mechanism-art.js';
import{PhysicalHookScene}from'../../../src/hook-experiment.js';import{createRenderer}from'../../../src/render.js?v=38-final';import{STARTER_HARDWARE}from'../../../src/starter.js';const $=id=>document.getElementById(id),renderer=createRenderer($('view')),entries=await(await fetch('./replay-index.json')).json();for(const [i,e]of entries.entries())$('case').add(new Option(e.label,String(i)));let s,last=0,time=0,paused=false,impacts=[],notice='',noticeUntil=0;
async function reset(){const mode=$('case').value;$('wind').hidden=mode!=='mechanism';if(mode==='mechanism')s=new PhysicalHookScene({...STARTER_HARDWARE,initialArm:-3,mechanicalWinding:true,releaseHardware:'channel',stoppedSplitPouch:true,pouchPanelMass:.5});else{const saved=await(await fetch(entries[Number(mode)].file)).json();s=new PhysicalHookScene(saved.p,saved.species,saved);}time=0;last=0;impacts=[];paused=false;notice='';noticeUntil=0;$('pause').textContent='Pause';}
$('inspect').onchange=()=>{$('view').hidden=$('inspect').checked;$('mechanism').hidden=!$('inspect').checked;};$('advance').onclick=()=>{paused=true;$('pause').textContent='Resume';for(let i=0;i<600;i++)s.step();time+=1;};$('step').onclick=()=>{paused=true;$('pause').textContent='Resume';for(let i=0;i<12;i++)s.step();time+=.02;};$('case').onchange=reset;$('replay').onclick=reset;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';};$('wind').onclick=()=>{if(['uncocked','loading'].includes(s.phase)){s.startWinding(.6);time=0;last=0;}};await reset();
function inspect(){if(!$('inspect').checked)return;const ctx=$('mechanism').getContext('2d'),p=q=>[240+q.x*40,560-(q.y-294)*40];ctx.clearRect(0,0,480,600);ctx.fillStyle='#d5e2d4';ctx.fillRect(0,0,480,600);ctx.fillStyle='#243b30';ctx.font='13px system-ui';ctx.fillText(`Fixed inspection camera • actual phase ${s.phase}`,10,20);for(let b=s.world.getBodyList();b;b=b.getNext())if(['frame','arm','pouch','pouchflap','hooklink'].includes(b.getUserData()?.role))for(let f=b.getFixtureList();f;f=f.getNext()){const shape=f.getShape();ctx.fillStyle=(f.getFilterCategoryBits()&64)?'#bca45d':b.getUserData().role==='hooklink'?'#d0b35e':b.getUserData().role.startsWith('pouch')?'#71988b':'#92724a';ctx.beginPath();if(shape.getType()==='circle'){const q=p(b.getWorldPoint(shape.getCenter()));ctx.arc(...q,shape.getRadius()*40,0,Math.PI*2);}else if(shape.getType()==='polygon'){const points=shape.m_vertices.map(v=>p(b.getWorldPoint(v)));ctx.moveTo(...points[0]);for(const q of points.slice(1))ctx.lineTo(...q);ctx.closePath();}ctx.fill();ctx.strokeStyle='#344b38';ctx.lineWidth=1;ctx.stroke();}drawMechanismDetails(ctx,s,p);}
function frame(now){inspect();const dt=Math.min(.03,last?(now-last)/1000:0);last=now;if(!paused&&time<($('case').value==='mechanism'?8:(entries[Number($('case').value)].seconds??.8))){const steps=Math.round(dt*600*Number($('speed').value));for(let i=0;i<steps;i++){s.step();for(const e of s.events.splice(0))if(e.type==='impact'){impacts.push({time:time+i/600,kind:e.encounter??e.surface??e.material});if(e.encounter){notice=e.encounter;noticeUntil=s.elapsed+.9;}}}time+=steps/600;}renderer.draw(s,null,[],time,$('reduced').checked,innerWidth,innerHeight,s.elapsed<noticeUntil?notice:'');const c=s.center();$('status').textContent=`${s.rig.label} • ${s.phase} • ${s.ropes.length} real straps • bead past outlet ${s.hookOpen?'yes':'no'} • replay ${time.toFixed(2)}s • x ${c.x.toFixed(2)} / vx ${c.vx.toFixed(2)} • contacts: ${impacts.slice(-5).map(e=>e.kind).join(', ')||'none yet'} • ${renderer.approachNotice}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
