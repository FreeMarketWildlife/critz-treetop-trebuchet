<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frozen physical joint-warning review</title><style>body{margin:8px;background:#182722;color:#ecf0df;font:14px system-ui}select,button{font:inherit;padding:10px;max-width:100%;margin:3px}canvas{width:100%;max-width:480px;display:block;background:#d0ddd0}output{display:block;margin:8px 0;max-width:70em}</style><h1>Physical warning poses</h1><p>Actual frozen fixture geometry from the full regression. No pose correction or resumed simulation. 1× uses the game's logical scale; 4× is inspection magnification.</p><select aria-label="Warning case" id="case"></select><button id="next">Next warning</button><label><input type="checkbox" id="zoom">4× inspection</label><label><input type="checkbox" id="highlight">Highlight affected part</label><output id="status"></output><canvas width="480" height="600"></canvas><script type="module">
import {createRig} from '../../../src/species.js';import {drawSpeciesMarkings} from '../../../src/species-art.js';import {drawFace} from '../../../src/scenery.js';import {drawGripTether} from '../../../src/grip-art.js';const data=await(await fetch('./angular-frames.json')).json(),select=document.querySelector('select'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');select.innerHTML=data.frames.map((f,i)=>`<option value="${i}">${f.id}</option>`).join('');function draw(){const f=data.frames[Number(select.value)],pose=f.pose,rig=createRig(f.species),scale=(pose.phase==='loading'?45:42)*(document.querySelector('#zoom').checked?4:1),point=p=>[240+(p.x-pose.center.x)*scale,300-(p.y-pose.center.y)*scale];ctx.clearRect(0,0,480,600);ctx.fillStyle='#d0ddd0';ctx.fillRect(0,0,480,600);if(pose.hand)drawGripTether(ctx,{anchor:point(pose.hand.anchor),target:point(pose.hand.target),capped:pose.hand.capped});for(const role of ['other','part'])for(const b of pose.bodies){if((b.tag?.role==='part')!==(role==='part'))continue;const part=rig.bodies.find(p=>p.id===b.tag?.id);for(const shape of b.fixtures){ctx.beginPath();if(shape.type==='circle'){ctx.arc(...point(shape.center),shape.radius*scale,0,Math.PI*2);}else{const vertices=shape.vertices.map(point);ctx.moveTo(...vertices[0]);for(const p of vertices.slice(1))ctx.lineTo(...p);ctx.closePath();}ctx.fillStyle=b.tag?.role==='part'?rig.color:['pouch','pouchflap'].includes(b.tag?.role)?'#71988b':b.tag?.role==='frame'?'#92724a':'#594936';ctx.fill();ctx.strokeStyle='#344b38';ctx.lineWidth=1.1;ctx.stroke();if(document.querySelector('#highlight').checked&&b.tag?.role==='part'&&b.tag.id===f.worst.bodyB.id){ctx.strokeStyle='#a84f31';ctx.lineWidth=2;ctx.stroke();}}
if(part){const p=point(b.position);drawSpeciesMarkings(ctx,{species:rig.id,part:part.id,shape:part.shape,x:p[0],y:p[1],angle:-b.angle,scale});if(part.id==='head')drawFace(ctx,{x:p[0],y:p[1],angle:-b.angle,size:Math.max(3,(part.shape.radius??.1)*scale),species:rig.id,color:rig.color});}}
document.querySelector('#status').textContent=`${f.id} • ${f.worst.phase} • ${f.worst.bodyB.id} • excess ${(f.worst.value*180/Math.PI).toFixed(2)}° • snapshot time ${f.worst.time.toFixed(5)}s. Frozen actual geometry; threshold excursions last at most one 1/600s outer sample in this regression.`;}
select.onchange=draw;document.querySelector('#next').onclick=()=>{select.value=(Number(select.value)+1)%data.frames.length;draw();};document.querySelector('#zoom').onchange=document.querySelector('#highlight').onchange=draw;draw();
</script>
