<!doctype html><meta charset="utf-8"><title>Iteration 18 scenery review — decorative fixtures</title><style>body{background:#192c25;color:#f5f1df;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}canvas{width:100%;aspect-ratio:2/1;border-radius:8px}h1{font-size:20px}p{font-size:13px}</style><h1>Decorative background fixtures — actual 42 px/m scale</h1><p>Static review of authored distant scenery. The outlined circle marks a 0.2 m reference; it is not a gameplay capture. No collision or camera changes.</p><main></main><script type="module">
import {drawScenery} from '../../../src/scenery.js';
for(const [region,y]of [['Grandfather Tree',300],['open sky',185],['jungle canopy',65],['forest floor',3]]){const div=document.createElement('section');div.append(region);const c=document.createElement('canvas');c.width=960;c.height=480;div.append(c);document.querySelector('main').append(div);const ctx=c.getContext('2d');drawScenery(ctx,{width:960,height:480,region,camera:{x:30,y},scale:42,reducedMotion:true});ctx.strokeStyle='#344b38';ctx.lineWidth=2;ctx.beginPath();ctx.arc(480,240,.2*42,0,Math.PI*2);ctx.stroke();}
</script>
