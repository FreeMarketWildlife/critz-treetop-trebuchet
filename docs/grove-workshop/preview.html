<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grove responsive QA</title><style>body{margin:0;background:#1e3328;color:#eee4c9;font:14px system-ui}header{height:45px;display:flex;align-items:center;gap:15px;padding:0 15px}iframe{border:0;transform-origin:top center;display:block;margin:auto;box-shadow:0 0 0 2px #b6bf8f}select{font:inherit}</style><header><label>Viewport <select id="size"><option value="390,844">390 × 844</option><option value="320,667">320 × 667</option><option value="844,390">844 × 390</option><option value="1031,738">1031 × 738</option></select></label><label>Page <select id="page"><option value="editor.html">Editor</option><option value="index.html?qa=1&amp;creative=1">Creative game</option></select></label></header><iframe title="Responsive workshop" src="../../editor.html"></iframe><script>const frame=document.querySelector('iframe'),size=document.querySelector('#size'),page=document.querySelector('#page');function fit(){const [w,h]=size.value.split(',').map(Number);frame.width=w;frame.height=h;frame.style.transform=`scale(${Math.min(1,(innerHeight-55)/h,(innerWidth-20)/w)})`;}size.onchange=fit;page.onchange=()=>{frame.src='../../'+page.value;fit()};window.onresize=fit;fit();</script></html>
