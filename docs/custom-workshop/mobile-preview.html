<!doctype html><html lang="en"><meta charset="utf-8"><title>Portrait game QA</title><style>html,body{background:#203e31;margin:0;height:100%;overflow:hidden;font:12px system-ui;color:#eee4bc}header{height:40px;display:flex;justify-content:center;align-items:center;gap:12px}select{font:inherit;background:#eee4bc;border:0;border-radius:5px;padding:4px}.phone{position:absolute;top:50px;left:50%;transform-origin:top center;border:5px solid #738568;border-radius:20px;overflow:hidden;box-shadow:0 5px 35px #0004}iframe{display:block;border:0;background:#b3c299}</style><header><span>Portrait viewport</span><select id="size" aria-label="Phone size"><option value="390,844">390 × 844</option><option value="320,667">320 × 667</option><option value="430,932">430 × 932</option></select><span>Isolated QA · no saves</span></header><div class="phone"><iframe src="../../?qa=1" title="Mobile game"></iframe></div><script>const phone=document.querySelector('.phone'),frame=document.querySelector('iframe'),size=document.querySelector('#size');function fit(){const[w,h]=size.value.split(',').map(Number);frame.width=w;frame.height=h;phone.style.width=w+'px';phone.style.height=h+'px';phone.style.transform=`translateX(-50%) scale(${Math.min(1,(innerHeight-65)/h)})`;}size.onchange=fit;window.onresize=fit;fit();</script></html>
