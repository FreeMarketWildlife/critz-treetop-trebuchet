<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandfather Tree art review</title><style>body{margin:0;background:#263d32;color:#f5e7b6;font:14px system-ui}nav{display:flex;gap:12px;align-items:center;padding:10px;position:sticky;top:0;background:#263d32}button{padding:8px;background:#ebdcae;border:0;border-radius:6px;color:#263d32}canvas{display:block;width:100%;height:calc(100vh - 60px)}p{margin:0}</style><nav><button data-view="tree">Whole tree</button><button data-view="launch">Launch scale</button><button data-view="jungle">Jungle layers</button><button data-view="floor">Forest floor</button></nav><canvas aria-label="Live world artwork"></canvas><script type="module">
import {drawGroveWorld} from '../../src/grove-art.js?v=16';import {createGroveMap,groveTreeBounds} from '../../src/grove-map.js?v=16';
const wide=new URLSearchParams(location.search).has('wide');if(wide){document.body.style.minWidth='1031px';document.querySelector('canvas').style.height='738px';}const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),map=createGroveMap();let view='tree';
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(2,devicePixelRatio);canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);let camera;if(view==='tree'){const b=groveTreeBounds(map);camera={x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2,scale:Math.min(w/(b.maxX-b.minX),h/(b.maxY-b.minY))*.93};}else camera=view==='launch'?{x:1,y:1.2,scale:Math.min(w/5.5,h/4)}:view==='jungle'?{x:380,y:-410,scale:Math.min(w/330,h/420)}:{x:408,y:-598,scale:Math.min(w/14,h/9)};for(const foreground of[false,true])drawGroveWorld(ctx,{camera,width:w,height:h,map,foreground});canvas.dataset.view=view;canvas.dataset.scale=camera.scale;}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});window.onresize=draw;draw();
</script></html>
