<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Critter cels & encounter scale</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;color:#344d3d;background:#e9ecd5;font:14px system-ui}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px;margin:0}p{margin:6px 0 16px}select{font:inherit;padding:8px;background:#fff4ce;border:2px solid #7b9266;border-radius:9px}.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cel{background:#faf2d8;border:2px solid #bec59d;border-radius:13px;text-align:center;padding:8px}.cel strong{display:block;font-size:12px;letter-spacing:.08em}canvas{display:block;width:100%;height:140px}#scale{width:100%;height:155px;background:#d1dec7;border-radius:12px}h2{font-size:16px;margin:18px 0 4px}small{display:block;color:#697e60}a{color:inherit}@media(max-width:600px){.poses{grid-template-columns:repeat(2,1fr)}canvas{height:110px}}</style><header><h1>A little slapstick in the grove ✦</h1><label>Volunteer <select id="animal"></select></label></header><p>Held poses · a fresh reaction for every meaningful hit · all eleven volunteers</p><section class="poses" id="poses"></section><h2>Fixed encounter sizes, beside an 18 cm field mouse</h2><small>One shared metre scale. Each named type has one size; bigger relatives are separate palette entries.</small><canvas id="scale" width="1900" height="310"></canvas><p><a href="../../editor.html">Open the World Workshop →</a></p><script type="module">
import {CRITTERS} from '../../src/build-catalog.js?v=10';import{drawCritter}from'../../src/build-art.js?v=10';import{ENEMIES}from'../../src/grove-map.js?v=10';import{drawGroveEnemy}from'../../src/grove-art.js?v=10';
const states=[['READY TO FLY','ready',0],['WHEEE!','flying',0],['BONK!','bonk-a',1],['OOF!','bonk-b',2],['SEEING STARS','stars',2],['STILL SMILING!','dazed',3]],select=document.querySelector('#animal'),poses=document.querySelector('#poses');
for(const a of CRITTERS){const o=document.createElement('option');o.value=a.id;o.textContent=a.name;select.append(o);}function draw(){poses.replaceChildren();for(const[label,pose,tier]of states){const box=document.createElement('div');box.className='cel';const name=document.createElement('strong');name.textContent=label;const canvas=document.createElement('canvas');canvas.width=600;canvas.height=280;box.append(name,canvas);poses.append(box);drawCritter(canvas.getContext('2d'),CRITTERS.find(a=>a.id===select.value),300,150,330,0,pose!=='ready',undefined,{pose,tier,frame:0});}}select.onchange=draw;draw();
const c=document.querySelector('#scale').getContext('2d');c.scale(2,2);c.font='11px system-ui';c.textAlign='center';drawCritter(c,CRITTERS[0],44,53,27,0,true,undefined,{pose:'flying',tier:0});c.fillStyle='#344d3d';c.fillText('Mouse',44,109);c.fillText('18 cm',44,126);ENEMIES.filter(e=>!e.variant).forEach((e,i)=>{const x=128+i*81;drawGroveEnemy(c,e.kind,x,53,e.radius*2*150);c.fillStyle='#344d3d';c.fillText(e.name.replace('Archive ','').replace('Round ','').replace('Wandering ',''),x,109);c.fillText(`${Math.round(e.radius*200)} cm`,x,126);});
</script></html>
