name: Game checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify pinned browser physics runtime
        run: cmp node_modules/planck/dist/planck.mjs vendor/planck/planck.mjs
